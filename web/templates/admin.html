<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Ouvidoria Backend</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .stats { display: flex; gap: 20px; margin-bottom: 20px; }
        .stat-box { background: #3498db; color: white; padding: 15px; border-radius: 6px; flex: 1; text-align: center; font-size: 1.2rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #2c3e50; color: white; }
        tr:hover { background-color: #f1f1f1; }
        .actions button { padding: 6px 12px; margin-right: 5px; border: none; border-radius: 4px; cursor: pointer; color: white; }
        .btn-edit { background-color: #f39c12; }
        .btn-delete { background-color: #e74c3c; }
        .form-add { background: #ecf0f1; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
        .form-add input[type="text"] { width: calc(100% - 120px); padding: 8px; margin-right: 10px; border: 1px solid #bdc3c7; border-radius: 4px; }
        .form-add button { padding: 8px 15px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ Painel de Administração - Backend (Porta 5000)</h1>
        
        <div class="stats">
            <div class="stat-box">
                Total de Reclamações: <strong id="totalCount">0</strong>
            </div>
            <div class="stat-box" style="background:#27ae60;">
                Status da API: <strong>Online</strong>
            </div>
        </div>

        <div class="form-add">
            <h3>Adicionar Nova Reclamação (Admin)</h3>
            <form id="addForm">
                <input type="text" id="newDesc" placeholder="Descreva a reclamação..." required>
                <button type="submit">+ Adicionar</button>
            </form>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Reclamação</th>
                    <th style="width: 150px;">Ações (Admin)</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data will be loaded here -->
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = '/api/reclamacoes';

        async function loadData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                document.getElementById('totalCount').innerText = data.length;
                
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                
                data.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>#${item.codigo}</strong></td>
                        <td>${item.reclamacao}</td>
                        <td class="actions">
                            <button class="btn-edit" onclick="editItem(${item.codigo}, '${item.reclamacao.replace(/'/g, "\\'")}')">Editar</button>
                            <button class="btn-delete" onclick="deleteItem(${item.codigo})">Excluir</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Erro ao carregar dados:", error);
                alert("Erro ao carregar dados da API.");
            }
        }

        document.getElementById('addForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const desc = document.getElementById('newDesc').value;
            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ reclamacao: desc })
            });
            document.getElementById('newDesc').value = '';
            loadData();
        });

        async function editItem(codigo, oldDesc) {
            const newDesc = prompt(`Editando Reclamação #${codigo}:`, oldDesc);
            if (newDesc && newDesc.trim() !== "") {
                await fetch(`${API_URL}/${codigo}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reclamacao: newDesc })
                });
                loadData();
            }
        }

        async function deleteItem(codigo) {
            if (confirm(`Tem certeza que deseja EXCLUIR a reclamação #${codigo}?`)) {
                await fetch(`${API_URL}/${codigo}`, { method: 'DELETE' });
                loadData();
            }
        }

        // Initial load
        loadData();
    </script>
</body>
</html>
